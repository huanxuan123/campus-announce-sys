services:
  - type: web
    name: campus-announce-sys
    env: docker
    plan: free
    region: oregon
    branch: main
    buildCommand: mvn clean package -DskipTests
    buildFilter:
      paths:
        - src
        - pom.xml
        - Dockerfile
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: JDBC_URL
        value: jdbc:mysql://dpg-xxxxx.oregon-postgres.render.com:5432/campus_announce?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      - key: JDBC_USERNAME
        value: campus_announce_user
      - key: JDBC_PASSWORD
        value: your_password_here
      - key: JDBC_DRIVER
        value: org.postgresql.Driver
    disk:
      name: data
      mountPath: /usr/local/tomcat/webapps/data
      sizeGB: 1